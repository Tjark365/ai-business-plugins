name: Test B2B Lead Finder

on:
  push:
    paths:
      - "01-b2b-lead-finder/**"
  pull_request:
    paths:
      - "01-b2b-lead-finder/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 01-b2b-lead-finder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest test_lead_finder.py
